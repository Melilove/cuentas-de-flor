let dbp=null;const mem={};
function idb(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open('cuentas-flor',1);r.onupgradeneeded=()=>r.result.createObjectStore('boletas');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function putBoleta(id,data){const db=await idb();if(!db){mem[id]=data;return}await new Promise(r=>{try{const tx=db.transaction('boletas','readwrite');tx.objectStore('boletas').put(data,id);tx.oncomplete=r;tx.onerror=()=>{mem[id]=data;r()}}catch(e){mem[id]=data;r()}})}
async function getBoleta(id){if(!id)return null;if(mem[id])return mem[id];const db=await idb();if(!db)return null;return new Promise(r=>{try{const q=db.transaction('boletas').objectStore('boletas').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function delBoleta(id){if(!id)return;delete mem[id];const db=await idb();if(!db)return;try{db.transaction('boletas','readwrite').objectStore('boletas').delete(id)}catch(e){}}
function readFile(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)})}
async function compress(f){const url=await readFile(f);if(!f.type.startsWith('image/'))return url;try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}catch(e){return url}}

const curYm=()=>ymOf(new Date());
const parseYm=ym=>{const[y,m]=ym.split('-').map(Number);return{y,m}};
const addM=(ym,n)=>{const{y,m}=parseYm(ym);const d=new Date(y,m-1+n,1);return ymOf(d)};
const diffM=(a,b)=>{const A=parseYm(a),B=parseYm(b);return(B.y-A.y)*12+(B.m-A.m)};
const ymLabel=ym=>{const{y,m}=parseYm(ym);return MESES[m-1].replace(/^./,c=>c.toUpperCase())+' '+y};
const isoToday=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);return d+' de '+MESES[m-1]};

function dueDate(a,ym){const{y,m}=parseYm(ym);const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(a.dia||30,last))}
function status(a,ym){
 const pay=(S.payments[ym]||{})[a.id];
 const due=dueDate(a,ym);const t=today();const days=Math.round((due-t)/864e5);
 if(pay)return{k:'ok',label:'Pagada',pay,days,due};
 if(days<0)return{k:'late',label:'Vencida',days,due};
 if(days===0)return{k:'soon',label:'Vence hoy',days,due};
 if(days<=3)return{k:'soon',label:days===1?'Vence mañana':'En '+days+' días',days,due};
 return{k:'pend',label:'Día '+due.getDate(),days,due};
}
function history(accId,beforeYm,max){
 const ms=Object.keys(S.payments).filter(k=>(!beforeYm||k<beforeYm)&&S.payments[k][accId]).sort().reverse().slice(0,max||6);
 return ms.map(k=>S.payments[k][accId].monto);
}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function monthTotal(ym){const p=S.payments[ym]||{};return Object.values(p).reduce((s,x)=>s+(x.monto||0),0)+S.otros.filter(o=>o.mes===ym).reduce((s,o)=>s+o.monto,0)}

function tick(){const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
setInterval(tick,15000);
let WX=null,wxTried=false;
const wxLabel=c=>c===0?'Despejado':c<=3?'Parcial nublado':c<=48?'Neblina':c<=67?'Lluvia':c<=77?'Nieve':c<=82?'Chubascos':'Tormenta';
function paintWeather(){const T=document.getElementById('wxT'),L=document.getElementById('wxL');if(!T)return;
 if(WX){T.textContent=Math.round(WX.t)+'°';L.textContent=wxLabel(WX.c);return}
 if(wxTried){L.textContent='Sin conexión al clima';return}
 wxTried=true;
 try{fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.45&longitude=-70.66&current=temperature_2m,weather_code&timezone=America%2FSantiago').then(r=>r.json()).then(d=>{WX={t:d.current.temperature_2m,c:d.current.weather_code};paintWeather()}).catch(()=>paintWeather())}catch(e){paintWeather()}
}

/* calculadora */
function calcState(k){return UI.calc[k]||(UI.calc[k]={d:'0',acc:null,op:null,fresh:true,hist:''})}
const cval=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
const cfmt=n=>isFinite(n)?(Math.round(n*100)/100).toLocaleString('es-CL',{maximumFractionDigits:2}):'Error';
function calcHTML(k){const c=calcState(k);const K=(x,cls,lab)=>`<button class="key ${cls||''}" data-a="ck" data-c="${k}" data-k="${x}"${lab?` aria-label="${lab}"`:''}>${x}</button>`;
 return `<div class="disp" id="cd-${k}" aria-live="polite"><small>${esc(c.hist)}</small>${esc(c.d)}</div><div class="keys">
 ${K('C','','Borrar todo').replace('class="key "','class="key " style="color:#C8102E"')}${K('%')}${K('⌫','','Borrar un número')}${K('÷','op')}
 ${K('7')}${K('8')}${K('9')}${K('×','op')}${K('4')}${K('5')}${K('6')}${K('−','op')}${K('1')}${K('2')}${K('3')}${K('+','op')}
 <button class="key" style="grid-column:span 2" data-a="ck" data-c="${k}" data-k="0">0</button>${K(',')}${K('=','eq')}</div>`}
function calcPress(k,x){const c=calcState(k);const apply=(a,b,op)=>op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?(b===0?NaN:a/b):b;
 if(/\d/.test(x)){if(c.fresh||c.d==='0'){c.d=x;c.fresh=false}else if(c.d.replace(/\D/g,'').length<12)c.d+=x}
 else if(x===','){if(c.fresh){c.d='0,';c.fresh=false}else if(!c.d.includes(','))c.d+=','}
 else if(x==='C'){UI.calc[k]={d:'0',acc:null,op:null,fresh:true,hist:''}}
 else if(x==='⌫'){if(!c.fresh){c.d=c.d.length>1?c.d.slice(0,-1):'0'}}
 else if(x==='%'){const v=cval(c.d);c.d=cfmt(c.op&&c.acc!=null?c.acc*v/100:v/100);c.fresh=true}
 else if('+−×÷'.includes(x)){const v=cval(c.d);if(c.op&&!c.fresh){c.acc=apply(c.acc,v,c.op)}else if(c.acc==null||!c.op){c.acc=v}c.op=x;c.fresh=true;c.hist=cfmt(c.acc)+' '+x;c.d=cfmt(c.acc)}
 else if(x==='='){if(c.op){const v=cval(c.d);const r=apply(c.acc,v,c.op);c.hist=cfmt(c.acc)+' '+c.op+' '+cfmt(v)+' =';c.d=cfmt(r);c.acc=null;c.op=null;c.fresh=true}}
 const el=document.getElementById('cd-'+k);if(el)el.innerHTML=`<small>${esc(UI.calc[k].hist)}</small>${esc(UI.calc[k].d)}`;
}

/* PDF anual */
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>res(window.jspdf);s.onerror=rej;document.head.appendChild(s)})}
async function makePDF(){
 const y=UI.pdfYear;toast('Preparando tu PDF…');
 let lib;try{lib=await loadJsPDF()}catch(e){toast('Se necesita internet para crear el PDF');return}
 const doc=new lib.jsPDF({unit:'mm',format:'a4'});const W=210;let yy=20;
 const foot=()=>{doc.setFontSize(9);doc.setTextColor(120,100,130);doc.text('Creada para Flor',W/2-4,289,{align:'right'});doc.text('por melitalove · Versión '+VERSION,W/2+4,289);doc.setFillColor(232,86,107);[[0,-1.3],[1.25,-.4],[.77,1.05],[-.77,1.05],[-1.25,-.4]].forEach(([dx,dy])=>doc.circle(W/2+dx,288+dy,.9,'F'));doc.setFillColor(242,183,5);doc.circle(W/2,288,.7,'F')};
 const need=h=>{if(yy+h>278){foot();doc.addPage();yy=20}};
 doc.setFillColor(91,35,128);doc.rect(0,0,W,34,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text('Las Cuentas de Flor',14,16);doc.setFontSize(13);doc.setFont('helvetica','normal');doc.text('Resumen anual '+y,14,26);yy=46;
 let anual=0;const boletas=[];
 for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0');const p=S.payments[ym]||{};const os=S.otros.filter(o=>o.mes===ym);const ids=Object.keys(p);if(!ids.length&&!os.length)continue;
  need(20);doc.setTextColor(91,35,128);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(ymLabel(ym),14,yy);yy+=7;doc.setFontSize(11);doc.setTextColor(40,20,50);
  let tot=0;
  const line=(n,f,v,b)=>{need(7);doc.setFont('helvetica','normal');doc.text(n,16,yy);doc.text(f,110,yy);doc.text(clp(v),196,yy,{align:'right'});if(b)doc.text('*',198,yy);yy+=6;tot+=v};
  S.accounts.forEach(a=>{if(p[a.id]){line(a.name,fmtDate(p[a.id].fecha),p[a.id].monto,!!p[a.id].boletaId);if(p[a.id].boletaId)boletas.push({id:p[a.id].boletaId,t:a.name+' · '+ymLabel(ym)})}});
  os.forEach(o=>{const c=S.cats.find(x=>x.id===o.cat);line((c?c.name:'Otro')+(o.nota?' ('+o.nota.slice(0,30)+')':''),fmtDate(o.fecha),o.monto,!!o.boletaId);if(o.boletaId)boletas.push({id:o.boletaId,t:(c?c.name:'Otro')+' · '+ymLabel(ym)})});
  need(9);doc.setDrawColor(220,200,230);doc.line(16,yy-3,196,yy-3);doc.setFont('helvetica','bold');doc.text('Total del mes',16,yy+2);doc.text(clp(tot),196,yy+2,{align:'right'});yy+=12;anual+=tot;}
 need(14);doc.setFillColor(252,233,168);doc.rect(14,yy-6,182,12,'F');doc.setTextColor(60,40,0);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Total del año '+y,18,yy+2);doc.text(clp(anual),192,yy+2,{align:'right'});yy+=14;
 if(!anual){doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Aún no hay pagos registrados en este año.',14,yy);}
 else if(boletas.length){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90,70,100);need(8);doc.text('* Tiene boleta adjunta al final del documento.',14,yy);}
 for(const b of boletas){const d=await getBoleta(b.id);foot();doc.addPage();doc.setTextColor(91,35,128);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Boleta · '+b.t,14,18);
  if(d&&d.startsWith('data:image')){try{const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=d});const k=Math.min(182/im.width,250/im.height);doc.addImage(d,'JPEG',14,26,im.width*k,im.height*k)}catch(e){doc.setFontSize(11);doc.text('No se pudo agregar la imagen.',14,30)}}
  else{doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(60,40,70);doc.text('Esta boleta está guardada como PDF dentro de la app.',14,30)}}
 foot();
 const name='Cuentas-de-Flor-'+y+'.pdf';
 let dl=null;try{if(window.claude&&window.claude.use)dl=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))])}catch(e){dl=null}
 if(dl){try{await dl.save({filename:name,data:doc.output('blob')});toast('PDF listo')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar el PDF')}return}
 doc.save(name);toast('PDF descargado');
}

 if(k==='monto'){const d=digits(el.value);el.value=d?d.toLocaleString('es-CL'):'';UI.form.monto=d;document.getElementById('montoErr').textContent='';document.getElementById('oliAlert').innerHTML=oliAlertHTML()}
 else if(k==='fmt'){const d=digits(el.value);el.value=d?d.toLocaleString('es-CL'):''}
 else if(k==='fecha')UI.form.fecha=el.value;
 else if(k==='nota')UI.form.nota=el.value;
 else if(k==='rut'){S.rut=el.value.trim();save()}
 else if(k==='accf'){const a=accById(el.dataset.id);const fld=el.dataset.f;if(fld==='dia'){const n=digits(el.value);if(n>=1&&n<=31)a.dia=n}else if(fld==='fijo'){const d=digits(el.value);el.value=d?d.toLocaleString('es-CL'):'';a.fijo=d||0}else a[fld]=el.value.trim();save()}
});
document.addEventListener('change',async e=>{const el=e.target;const k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='mes'){UI.payYm=el.value;initForm();vPay()}
 else if(k==='anio'){UI.pdfYear=+el.value}
 else if(k==='file'||k==='ofile'){const file=el.files&&el.files[0];el.value='';if(!file)return;if(file.size>15e6){toast('El archivo es muy grande (máx. 15 MB)');return}
  const data=await compress(file);const isPdf=file.type==='application/pdf';
  if(k==='file'){UI.form.newB=data;UI.form.newType=isPdf?'pdf':'img';document.getElementById('boletaBox').innerHTML=boletaBoxHTML()}
  else{UI.otroB=data;const box=document.getElementById('oBox');if(box)box.innerHTML=isPdf?`<div style="font-weight:800">${ic('file')} PDF listo</div>`:`<img class="thumb" src="${data}" alt="Vista previa de la boleta">`}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function notify(force){if(!('Notification' in window)||Notification.permission!=='granted')return;const d=isoToday();if(!force&&S.notifDay===d)return;
 const ym=curYm();const items=S.accounts.map(a=>({a,s:status(a,ym)})).filter(x=>x.s.k==='late'||x.s.k==='soon');if(!items.length)return;
 try{new Notification('Las Cuentas de Flor',{body:items.map(x=>x.a.name+': '+(x.s.k==='late'?'vencida':x.s.label.toLowerCase())).join(' · ')});S.notifDay=d;save()}catch(e){}}

/* inicio */
document.getElementById('splashLogo').innerHTML=logo();document.getElementById('splashFlor').innerHTML=FLOR;
render();

/* PWA: funciona sin internet y protege los datos */
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('out');setTimeout(()=>s.remove(),600);notify()},1600);
})();
</script>
</body>
